name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Uses GITHUB_TOKEN, so release PRs won't trigger CI on their own.
      # Swap in a fine-grained PAT secret here if that becomes a problem.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          target-branch: master
